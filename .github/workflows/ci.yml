name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Plugin & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Qt6 QML Lint tool
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools jq || true
          if [ -d /usr/lib/qt6/bin ]; then
            echo "/usr/lib/qt6/bin" >> $GITHUB_PATH
          fi

      - name: Run manifest test
        run: python3 test/manifest_test.py

      - name: Lint QML
        run: |
          if command -v qmllint >/dev/null 2>&1; then
            qmllint BarWidget.qml
          else
            echo "qmllint not available, skipping QML linting"
          fi
